name: Application CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - feature/**
      - develop
      - main

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

      - name: Build Docker image
        run: docker build -t fastapi-ecs-app:ci .