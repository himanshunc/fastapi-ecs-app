name: Application CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - feature/**
      - develop
      - main

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      PYTHONPATH: .

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

      - name: Build Docker image
        run: docker build -t fastapi-ecs-app:ci .

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ap-south-1 \
          | docker login --username AWS --password-stdin ${{ vars.ECR_REPOSITORY_URI }}

      - name: Build Docker image with tags
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          docker build -t fastapi-ecs-app:$IMAGE_TAG .
          docker tag fastapi-ecs-app:$IMAGE_TAG ${{ vars.ECR_REPOSITORY_URI }}:$IMAGE_TAG
          docker tag fastapi-ecs-app:$IMAGE_TAG ${{ vars.ECR_REPOSITORY_URI }}:latest

      - name: Push Docker image to ECR
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          docker push ${{ vars.ECR_REPOSITORY_URI }}:$IMAGE_TAG
          docker push ${{ vars.ECR_REPOSITORY_URI }}:latest